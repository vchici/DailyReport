[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dailyreport"
version = "0.1.2"
description = "AI 驱动的个人日报记录与生成工具"
readme = "README.md"
license = "MIT"
authors = [
    {name = "vchici", email = "vchici@proton.me"},
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42",
    "ddgs>=7.0.0",
    "rich>=13.0.0",
]

[project.scripts]
dailyreport = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]
